# AI Insights Dashboard
# Usage:  docker compose up
# Optional AI narratives:   export OPENAI_API_KEY=...   (or a .env file)  before `up`.
# Without the key the app runs in local statistics mode — all analytics still work.

services:
  dashboard:
    build: .
    image: ai-insights-dashboard:latest
    container_name: ai-insights-dashboard
    ports:
      - "8050:8050"
    environment:
      DASH_HOST: 0.0.0.0
      DASH_PORT: "8050"
      DASH_DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      MAX_ROWS: ${MAX_ROWS:-200000}
      SESSION_STORE_CAPACITY: ${SESSION_STORE_CAPACITY:-64}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8050/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
