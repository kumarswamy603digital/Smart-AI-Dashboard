[project]
name = "ai-insights-dashboard"
version = "1.0.0"
description = "Interactive data analytics dashboard with data-grounded OpenAI insights (Python, pandas, Plotly Dash)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
    "plotly==7.1.0",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "openai==2.41.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "kaleido==1.5.0"]
prod = [
    "gunicorn==23.0.0; platform_system != 'Windows'",
    "waitress==3.0.2; platform_system == 'Windows'",
]

[project.scripts]
ai-dashboard = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
